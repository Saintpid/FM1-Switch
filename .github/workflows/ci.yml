name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet -r requirements.txt
      - run: python tests/install_test.py
      - run: python tests/switch_test.py
      - run: python tests/rescue_test.py
      - run: python tests/export_test.py

  version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VERSION has its CHANGELOG section
        run: |
          v="$(tr -d ' \r\n' < VERSION)"
          grep -q "^## $v\$" CHANGELOG.md || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }

  windows-installer:
    name: Windows installer
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The release scripts parse
        shell: pwsh
        run: |
          foreach ($f in 'scripts/release.ps1', 'scripts/build-installer.ps1') {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "${f}: $_" }; exit 1 }
          }
      - name: Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      # the same build as a release (scripts/release.ps1 runs it); unsigned here
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build-installer.ps1
      # Verify the build only. Installer distribution is through Patreon.

  mac-dev-build:
    name: Mac build (unsigned development)
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: python.org's universal2 Python 3.12 (what the Mac build requires)
        run: |
          curl -sSfL -o py.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg py.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -c "import sysconfig, tkinter; print(sysconfig.get_platform())"
      - name: Rosetta (the x86_64-parent probe)
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license || true
      # The whole Mac build as a release runs it, but ad hoc signed and not notarized: universal wheels,
      # PyInstaller universal2, both slices and macOS 11.0 in every Mach-O, native probes, PKG, DMG.
      - run: bash build_fm1_mac.sh --unsigned-dev
        env:
          # Explicit test fixture for an UNPUBLISHED unsigned development DMG.
          # Release builds require the selected Mac-local Certificat image.
          NOISEBUD_DMG_BACKGROUND: ${{ github.workspace }}/mac/assets/MacInstaller.png
      # Verify the build only; do not upload a downloadable DMG to GitHub.
